<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Read — UNCHARTED</title>
<link rel="icon" href="assets/logo.jpg" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css" />
<style>
  body { background: var(--bg-black); }
  .reader-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 24px; border-bottom: 1px solid var(--line);
    background: rgba(10,10,10,0.9); position: sticky; top: 0; z-index: 20;
  }
  .reader-header .back { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; color: var(--cream-dim); }
  .reader-header .back:hover { color: var(--bronze-light); }
  .reader-title { font-family: var(--serif); font-size: 1rem; color: var(--cream); text-align: center; }
  .reader-stage {
    display: flex; justify-content: center; align-items: flex-start;
    min-height: calc(100vh - 140px); padding: 30px 16px; overflow: auto; background: #050505;
  }
  #pdf-canvas { box-shadow: var(--shadow); border-radius: 4px; max-width: 100%; height: auto; }
  .reader-toolbar {
    position: sticky; bottom: 0; z-index: 20;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    padding: 14px; border-top: 1px solid var(--line);
    background: rgba(10,10,10,0.92); backdrop-filter: blur(10px); flex-wrap: wrap;
  }
  .tool-btn {
    background: var(--bg-charcoal); border: 1px solid var(--line); color: var(--cream);
    width: 44px; height: 44px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    transition: border-color 0.25s, color 0.25s;
  }
  .tool-btn:hover { border-color: var(--bronze-light); color: var(--bronze-light); }
  .page-indicator { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--cream-dim); padding: 0 10px; }
  .page-indicator input {
    width: 46px; text-align: center; background: var(--bg-charcoal); border: 1px solid var(--line);
    border-radius: 6px; color: var(--cream); padding: 8px 4px;
  }
  #reader-loading, #reader-empty {
    display: none; flex-direction: column; align-items: center; gap: 14px; color: var(--cream-dim);
    min-height: calc(100vh - 140px); justify-content: center; text-align: center;
    padding: 0 20px;
  }
  #reader-loading { display: flex; }

  @media (max-width: 560px) {
    .reader-header { padding: 12px 14px; }
    .reader-header .back span { display: none; }
    .reader-title { font-size: 0.82rem; max-width: 45vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .reader-stage { padding: 16px 8px; }
    .reader-toolbar { padding: 10px; gap: 6px; }
    .tool-btn { width: 40px; height: 40px; }
    .page-indicator { padding: 0 4px; font-size: 0.8rem; }
    .page-indicator input { width: 38px; padding: 6px 2px; }
  }
</style>
</head>
<body>

<div class="reader-header">
  <a href="index.html" class="back">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    <span>Back</span>
  </a>
  <div class="reader-title" data-book-title>Loading…</div>
  <img data-logo src="assets/logo.jpg" alt="Uncharted" style="height:22px" />
</div>

<div class="reader-stage">
  <canvas id="pdf-canvas"></canvas>
  <div id="reader-loading">
    <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#d9a86c" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
    <p>Opening the book…</p>
  </div>
  <div id="reader-empty">
    <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d9a86c" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
    <p>No book is available to read right now.</p>
  </div>
</div>

<div class="reader-toolbar">
  <button class="tool-btn" id="prev-page" aria-label="Previous page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button>
  <div class="page-indicator">
    <input type="number" id="page-num" min="1" value="1" inputmode="numeric" pattern="[0-9]*" />
    <span>/ <span id="page-count">–</span></span>
  </div>
  <button class="tool-btn" id="next-page" aria-label="Next page"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>
  <span style="width:1px;height:26px;background:var(--line);margin:0 6px"></span>
  <button class="tool-btn" id="zoom-out" aria-label="Zoom out">−</button>
  <button class="tool-btn" id="zoom-in" aria-label="Zoom in">+</button>
  <button class="tool-btn" id="fullscreen" aria-label="Fullscreen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg></button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/book-pdf-data.js"></script>
<script src="js/supabase-client.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
